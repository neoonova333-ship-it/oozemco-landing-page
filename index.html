<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أوزيم | Oozem — العناية الشخصية والمنظفات</title>
<meta name="description" content="أوزيم: علامة صناعية متخصصة في منتجات العناية الشخصية والمنزلية والسيارات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Cairo:wght@400;600;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>if(/googtrans=\/ar\/en/.test(document.cookie)){document.documentElement.lang="en";document.documentElement.dir="ltr"}</script>
<!-- ===== Meta Pixel: ضع كود Meta Pixel الخاص بالشركة هنا ===== -->
<!-- ===== End Meta Pixel ===== -->
</head>
<body>
<header class="top">
  <a class="brand notranslate" href="#hero" aria-label="Oozem CheMechs">
    <img class="brand-mark" src="images/logo-full.png" alt="Oozem CheMechs Industrial &amp; Trade – Beyond Limits" width="73" height="68">
    <span class="brand-sep" aria-hidden="true"></span>
    <img class="brand-word" src="images/logo-wordmark.svg" alt="OOZEM" width="123" height="26">
  </a>
  <nav>
    <a href="#about">من نحن</a><a href="#identity">هويتنا</a><a href="#services">خدماتنا</a><a href="#products">منتجاتنا</a><a href="#contact">تواصل معنا</a>
  </nav>
  <button class="lang notranslate" id="langBtn" type="button">English</button>
</header>

<section id="hero" class="hero">
  <div class="wrap hero-grid">
    <div>
      <p class="script" data-k="hero.kicker"></p>
      <h1 data-k="hero.title"></h1>
      <p class="lead" data-k="hero.text"></p>
      <p class="size"><span data-k="hero.product"></span> · <b class="num" data-k="hero.size"></b></p>
      <a class="btn neon" data-k="hero.cta_text" data-href="hero.cta_url" href="#products"></a>
    </div>
    <div class="shot"><img data-src="hero.image" alt="Oozem Body Wash" onerror="this.style.display='none'"></div>
  </div>
</section>

<section id="about" class="sec">
  <div class="wrap narrow">
    <h2 data-k="about.title"></h2>
    <p data-k="about.text"></p>
    <a class="btn gold" data-k="about.catalog_text" data-href="about.catalog_url" href="#" download></a>
  </div>
</section>

<section id="identity" class="sec alt">
  <div class="wrap">
    <h2 data-k="identity.title"></h2>
    <div class="grid three" id="identity-grid"></div>
  </div>
</section>

<section id="services" class="sec">
  <div class="wrap">
    <h2 data-k="services_title"></h2>
    <div class="grid three" data-list="services"></div>
  </div>
</section>

<section id="products" class="sec alt">
  <div class="wrap">
    <h2 data-k="products_title"></h2>
    <div class="grid three" data-list="products"></div>
  </div>
</section>

<section id="features" class="sec">
  <div class="wrap">
    <h2 data-k="features_title"></h2>
    <div class="grid three" data-list="features"></div>
  </div>
</section>

<section id="contact" class="sec contact">
  <div class="wrap narrow center">
    <h2 data-k="contact.title"></h2>
    <p data-k="contact.text"></p>
    <a class="btn neon big" id="chat" target="_blank" rel="noopener" data-k="contact.chat_text" href="#"></a>
    <div class="icons">
      <a id="c-call" aria-label="اتصال" href="#">📞<span>اتصال</span></a>
      <a id="c-wa" aria-label="واتساب" target="_blank" rel="noopener" href="#">💬<span>واتساب</span></a>
      <a id="c-mail" aria-label="البريد الإلكتروني" href="#">✉️<span>البريد</span></a>
      <a id="c-web" aria-label="الموقع الإلكتروني" href="#">🌐<span>الموقع</span></a>
    </div>
  </div>
</section>

<footer class="foot">
  <div class="wrap foot-grid">
    <a class="foot-logo" href="#hero" aria-label="Oozem CheMechs Industrial &amp; Trade">
      <img src="images/oozem-logo.png" width="320" height="294" loading="lazy" alt="Oozem CheMechs · Industrial &amp; Trade — Beyond Limits">
    </a>
    <div class="foot-brand">
      <img class="wordmark" src="images/oozem-wordmark.svg" width="220" height="46" loading="lazy" alt="OOZEM">
      <p>علامة صناعية متخصصة في منتجات العناية الشخصية والمنزلية والعناية بالسيارات.</p>
      <nav class="foot-nav"><a href="#about">من نحن</a><a href="#services">خدماتنا</a><a href="#products">منتجاتنا</a><a href="#contact">تواصل معنا</a></nav>
    </div>
  </div>
  <p class="copy">© <span id="yr"></span> <span class="notranslate">Oozem CheMechs Industrial &amp; Trade</span>. جميع الحقوق محفوظة.</p>
</footer>

<script>
const get=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const card=i=>`<article class="card"><h3>${esc(i.title)}</h3><p>${esc(i.text)}</p>${i.items?`<ul>${i.items.map(x=>`<li>${esc(x.name||x)}</li>`).join('')}</ul>`:''}</article>`;
fetch('content/site.json').then(r=>r.json()).then(d=>{
  document.querySelectorAll('[data-k]').forEach(e=>{const v=get(d,e.dataset.k);if(v!=null)e.textContent=v});
  document.querySelectorAll('[data-href]').forEach(e=>{const v=get(d,e.dataset.href);if(v)e.href=v});
  document.querySelectorAll('[data-src]').forEach(e=>{const v=get(d,e.dataset.src);if(v)e.src=v});
  document.querySelectorAll('[data-list]').forEach(e=>{e.innerHTML=(d[e.dataset.list]||[]).map(card).join('')});
  document.getElementById('identity-grid').innerHTML=[d.identity.vision,d.identity.mission,d.identity.values].map(card).join('');
  const c=d.contact,wa='https://wa.me/'+c.whatsapp.replace(/\D/g,'').replace(/^00/,'');
  chat.href=wa;document.getElementById('c-wa').href=wa;
  document.getElementById('c-call').href='tel:+'+c.phone.replace(/\D/g,'').replace(/^00/,'');
  document.getElementById('c-mail').href='mailto:'+c.email;
  document.getElementById('c-web').href='https://'+c.website;
}).catch(()=>{});
document.getElementById('yr').textContent=new Date().getFullYear();
</script>
<div id="google_translate_element" style="display:none"></div>
<script>
/* الترجمة الإنجليزية التلقائية: تترجم الصفحة الحالية كما هي، فأي تغيير في المحتوى ينعكس على الإنجليزية */
const isEn=/googtrans=\/ar\/en/.test(document.cookie);
const langBtn=document.getElementById('langBtn');
langBtn.textContent=isEn?'العربية':'English';
langBtn.onclick=()=>{
  const h=location.hostname,past='expires=Thu, 01 Jan 1970 00:00:00 GMT';
  if(isEn){document.cookie='googtrans=;path=/;'+past;document.cookie='googtrans=;path=/;domain='+h+';'+past}
  else{document.cookie='googtrans=/ar/en;path=/';document.cookie='googtrans=/ar/en;path=/;domain='+h}
  location.reload();
};
function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'ar',includedLanguages:'ar,en',autoDisplay:false},'google_translate_element')}
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
</body>
</html>
